[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fpo-flyers"
version = "1.0.0"
description = "Automated FPO flyer generation for Princeton ORFE"
requires-python = ">=3.11"
dependencies = [
    "icalendar>=6.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "Jinja2>=3.1",
    "WeasyPrint>=62.0",
    "click>=8.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "PyYAML>=6.0",
]
dev = [
    "ruff>=0.17",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.scripts]
fpo-flyers = "fpo_flyers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpo_flyers = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that hit live network (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Explicit so results do not drift with ruff's default rule set.
select = ["E", "F", "W", "I", "UP", "B", "BLE", "PLW"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# WeasyPrint ships no type information.
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true
