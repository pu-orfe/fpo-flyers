name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Version pinned here; uv.lock pins everything it installs.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          activate-environment: true

      # Fails if uv.lock is out of date with pyproject.toml.
      - name: Lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --extra test --extra dev

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same image and command as `docker-compose run unit-tests`.
      - name: Build test image
        run: docker build -f Dockerfile.test -t fpo-flyers-test .

      # pytest exits non-zero when no tests are collected, so an empty run fails.
      - name: Unit tests
        run: docker run --rm fpo-flyers-test -v tests/unit/ -m "not integration"

      - name: Build production image
        run: docker build -f Dockerfile -t fpo-flyers .
