name: Generate FPO Flyers

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force regeneration (skip change detection)"
        required: false
        default: "false"
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

# main is protected by a ruleset that requires CI, and the workflow token cannot
# bypass it, so this workflow never pushes: the feed hash is published with the
# site, and the keepalive uses the API. Jobs add only the permissions they need.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ── Lightweight change detection (no Python, no deps) ──────────
  check:
    if: ${{ inputs.force != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # find the site URL
      actions: write # keepalive re-enables this workflow
    outputs:
      changed: ${{ steps.hash.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check feed for changes
        id: hash
        env:
          ICS_FEED_URL: ${{ vars.ICS_FEED_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FEED_URL="${ICS_FEED_URL:-https://orfe.princeton.edu/feeds/events/ical.ics?tid=491}"
          # Hash must match Python's compute_feed_hash():
          #   filter DTSTAMP lines, strip \r, join with \n (no trailing newline), SHA-256
          FEED=$(curl -fsSL "$FEED_URL")
          CURRENT=$(printf '%s\n' "$FEED" | tr -d '\r' | { grep -v '^DTSTAMP' || true; } \
            | perl -pe 'chomp if eof' | sha256sum | cut -d' ' -f1)

          # The last deployed hash is published with the site (see "Build site").
          PAGES_URL=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          STATUS=$(curl -sS -o published_hash.txt -w '%{http_code}' "${PAGES_URL%/}/feed_hash.txt")
          case "$STATUS" in
            200) STORED=$(tr -d '[:space:]' < published_hash.txt) ;;
            404) STORED=""; echo "No published hash yet." ;;
            *) echo "::error::Fetching the published hash returned HTTP $STATUS"; exit 1 ;;
          esac

          echo "current=$CURRENT"
          echo "stored=$STORED"
          if [ "$CURRENT" = "$STORED" ]; then
            echo "Feed unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Feed changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, and the feed can sit unchanged for a whole summer. Re-enabling
      # the workflow through the API resets that without a commit to main.
      - name: Keep scheduled workflow alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AGE_DAYS=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Days since last commit: $AGE_DAYS"
          if [ "$AGE_DAYS" -lt 50 ]; then
            echo "Recent activity; no keepalive needed."
            exit 0
          fi
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/generate.yml/enable"
          echo "Re-enabled the workflow to reset the inactivity timer."

  # ── Full generation (only when feed changed or force) ──────────
  generate:
    needs: check
    if: ${{ always() && (needs.check.outputs.changed == 'true' || needs.check.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Version pinned here; uv.lock pins everything it installs.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          activate-environment: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 libffi-dev libcairo2 libharfbuzz-subset0 \
            fonts-liberation \
            zsh  # tests/unit/test_ruleset.py runs scripts/apply-ruleset.sh

      - name: Install Python dependencies
        run: uv sync --locked --extra test

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

      - name: Generate flyers
        id: generate
        env:
          ICS_FEED_URL: ${{ vars.ICS_FEED_URL }}
          BYPASS_HEADER: ${{ secrets.BYPASS_HEADER }}
        run: |
          set -- --output-dir output --hash-file output/feed_hash.txt --verbose --force
          if [ -n "$ICS_FEED_URL" ]; then
            set -- "$@" --feed-url "$ICS_FEED_URL"
          fi
          if [ -n "$BYPASS_HEADER" ]; then
            set -- "$@" --bypass-header "$BYPASS_HEADER"
          fi
          fpo-flyers "$@"

      - name: Build site
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          cp docs/style.css _site/
          cp docs/slideshow.html _site/
          cp docs/view.html _site/
          # Published so the check job can tell whether the feed changed since this deploy.
          cp output/feed_hash.txt _site/feed_hash.txt
          cp output/*.pdf _site/ 2>/dev/null || true
          cp output/*.html _site/ 2>/dev/null || true
          # The manifest is written by the generator now (src/fpo_flyers/manifest.py), so it
          # carries the candidate, start time and location rather than just filenames.
          # Assembling it here from `ls *.pdf` was why consumers could not tell an upcoming
          # FPO from one that had already happened.
          #
          # An empty or absent manifest is still valid: the generator writes `[]` when the
          # feed has no events, and this fallback covers a run where no flyers were produced
          # at all, so the page never fetches a 404.
          if [ -f output/manifest.json ]; then
            cp output/manifest.json _site/manifest.json
          else
            echo "[]" > _site/manifest.json
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  # ── Deploy (separate job, as in GitHub's Pages starter workflow) ──
  # Deploying in the same job, milliseconds after the upload finalizes, sometimes
  # fails with 'No artifacts named "github-pages" were found': the artifact is not
  # yet visible to the API. The job boundary gives it time; one retry covers the rest.
  deploy:
    needs: generate
    if: ${{ always() && needs.generate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      # No continue-on-error: a second failure fails the run.
      - name: Retry deploy
        id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
