# Python dependencies are locked with uv (see README, "Updating dependencies").
# Dependabot's pip updater does not regenerate uv's hashes, so it is not enabled.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A new Python minor also needs the workflow's python-version and new
    # lockfiles, so make that move by hand. Take 3.12.x patches and digests.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
